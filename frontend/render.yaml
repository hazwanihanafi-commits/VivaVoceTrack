services:
  - type: web
    runtime: static
    name: vivavocetrack
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://vivatrack-backend.onrender.com
